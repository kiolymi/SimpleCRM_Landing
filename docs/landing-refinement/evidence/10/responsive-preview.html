<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Локальная проверка адаптивности Simple CRM</title>
<style>body{margin:0;background:#dce3eb;color:#132a40;font:16px/1.5 system-ui}header{padding:12px 20px;position:sticky;top:0;background:white;z-index:2;display:flex;gap:20px;align-items:center;flex-wrap:wrap}select{font:inherit;padding:6px}main{padding:16px;width:max-content;min-width:calc(100% - 32px)}iframe{display:block;border:0;background:white;margin:auto;width:390px;height:844px}p{margin:0;font-size:13px}</style></head>
<body><header><label>Ширина страницы <select id="size"><option>360</option><option selected>390</option><option>768</option><option>1024</option><option>1440</option></select> px</label><p>Только локальная проверка CSS в iframe. Не эмуляция устройства, касаний или масштаба ОС.</p></header><main><iframe src="../../../../" title="Simple CRM — адаптивный просмотр"></iframe></main>
<script>document.querySelector('#size').addEventListener('change',event=>{document.querySelector('iframe').style.width=event.target.value+'px';});</script></body></html>
